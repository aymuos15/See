[package]
name = "viewer"
version = "0.1.0"
edition = "2021"
description = "A Helix-inspired terminal file viewer with syntax highlighting"
license = "MIT"
repository = "https://github.com/aymuos15/See"
# Bench targets are listed explicitly, so benches/fixtures.rs stays a shared
# module rather than becoming a target of its own.
autobenches = false

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
nucleo-matcher = "0.3"
globset = "0.4"
notify = "7.0"
notify-debouncer-mini = "0.5"
arboard = "3.4"
streaming-iterator = "0.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
# Only the formats listed in IMAGE_EXTENSIONS; the default set drags in
# AVIF/OpenEXR encoders that cost more to build than the rest of the tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico", "tga"] }
pdfium-render = { version = "0.8", features = ["image"] }
# Only built with --features iai; see benchmarks/README.md.
iai-callgrind = { version = "0.16", optional = true }
unicode-width = "0.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-md = "0.5.3"
tree-sitter-cuda = "0.21.1"
codebook-tree-sitter-latex = "0.6.1"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
suspicious = "warn"
complexity = "warn"
style = "warn"
perf = "warn"
correctness = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[dev-dependencies]
tempfile = "3.8"
# Plotting is left out: the html_reports feature covers what a single machine
# needs, and the gnuplot path would depend on a system binary.
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }


# Benchmarks are built with the release profile, whose full LTO costs ~40s per
# rebuild. Thin LTO keeps the edit-measure loop usable; benchmarks/README.md
# records that this is not quite the shipped binary's codegen.
[profile.bench]
lto = "thin"
codegen-units = 16
# The release profile below strips symbols, which bench inherits; Callgrind
# and flamegraphs need them.
strip = false
debug = true

[[bench]]
name = "render"
harness = false

[[bench]]
name = "highlight"
harness = false

[[bench]]
name = "parse"
harness = false

# Instruction counting needs Valgrind installed, so it is opt-in:
#   cargo bench --features iai --bench instructions
[[bench]]
name = "instructions"
harness = false
required-features = ["iai"]

[features]
iai = ["dep:iai-callgrind"]

# Debug builds spend most of their time in unoptimized syntect/tree-sitter/
# image/pdfium; optimizing just the dependencies keeps the dev loop usable
# without slowing incremental rebuilds of this crate.
[profile.dev.package."*"]
opt-level = 2

# Optimized release profile for smaller, faster binaries
[profile.release]
codegen-units = 1  # Better optimization (slower compile)
lto = true         # Link-time optimization across crates
panic = "abort"    # Smaller binary, no stack unwinding
strip = true       # Remove symbols from binary
