[package]
name = "viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
syntect = "5.2"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
nucleo-matcher = "0.3"
globset = "0.4"
notify = "7.0"
notify-debouncer-mini = "0.5"
arboard = "3.4"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
suspicious = "warn"
complexity = "warn"
style = "warn"
perf = "warn"
correctness = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[dev-dependencies]
tempfile = "3.8"
